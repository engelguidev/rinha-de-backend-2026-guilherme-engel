worker_processes 1;
worker_rlimit_nofile 8192;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 8192;
  use epoll;
  multi_accept on;
}

http {
  access_log off;
  sendfile off;
  tcp_nopush off;
  tcp_nodelay on;
  keepalive_timeout 65;
  keepalive_requests 1000000;
  server_tokens off;

  upstream api_backends {
    least_conn;

    server unix:/run/uds/api1.sock max_fails=1 fail_timeout=10s;
    server unix:/run/uds/api2.sock max_fails=1 fail_timeout=10s;

    keepalive 256;
    keepalive_requests 1000000;
    keepalive_timeout 65s;
  }

  server {
    listen 9999 default_server reuseport backlog=8192;

    location = /ready {
      proxy_pass http://api_backends/ready;

      proxy_http_version 1.1;
      proxy_set_header Connection "";

      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 2;

      proxy_connect_timeout 5s;
      proxy_read_timeout 5s;
      proxy_send_timeout 5s;
    }

    location = /fraud-score {
      proxy_pass http://api_backends;

      proxy_http_version 1.1;
      proxy_set_header Connection "";

      proxy_buffering off;
      proxy_request_buffering off;

      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 2;

      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      proxy_connect_timeout 10s;
    }

    location / {
      proxy_pass http://api_backends;

      proxy_http_version 1.1;
      proxy_set_header Connection "";

      proxy_buffering off;
      proxy_request_buffering off;

      proxy_next_upstream error timeout http_500 http_502 http_503 http_504;
      proxy_next_upstream_tries 2;

      proxy_read_timeout 30s;
      proxy_send_timeout 30s;
      proxy_connect_timeout 10s;
    }
  }
}