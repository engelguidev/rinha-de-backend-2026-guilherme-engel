services:
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20MB"

  api1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - INDEX_PATH=/app/data/knn.idx
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - INDEX_PATH=/app/data/knn.idx
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

