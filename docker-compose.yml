services:
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - uds:/run/uds
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    cpus: "0.16"
    mem_limit: 30m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  api1:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - UDS_PATH=/run/uds/api1.sock

      # Runtime
      - DOTNET_GCHeapCount=1
      - DOTNET_PROCESSOR_COUNT=1
      - DOTNET_ThreadPool_UnfairSemaphoreSpinLimit=0
      - GC_LATENCY_MODE=sustained

      # Paths
      - INDEX_PATH=/app/data/knn.idx
      - IVF_INDEX_PATH=/app/data/ivf.idx
      - RESOURCES_PATH=/app/resources

      # Search
      - USE_BRUTE=false
      - USE_IVF=true

      # MELHOR CONFIG ENCONTRADA
      - IVF_CLUSTERS=128
      - IVF_NPROBE=1
      - IVF_MAX_VECTORS=64
      - IVF_ITERS=7

      # KNN
      - KNN_K=5
      - FRAUD_THRESHOLD=0.60

      # Partitioning
      - MAX_PARTITIONS_TO_SCAN=1
      - MAX_PARTITION_ITEMS=64
      - MAX_PARTITION_HARD=true
      - PARTITION_ONLY=true

      # ThreadPool
      - TP_MIN_WORKERS=4
      - TP_MAX_WORKERS=4
      - TP_MIN_IO=2
      - TP_MAX_IO=4

      # ASP.NET
      - KESTREL_BACKLOG=4096
      - ASPNETCORE_LOGGING__LOGLEVEL__DEFAULT=Warning

    volumes:
      - uds:/run/uds
    cpus: "0.42"
    mem_limit: 160m

  api2:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - UDS_PATH=/run/uds/api2.sock

      # Runtime
      - DOTNET_GCHeapCount=1
      - DOTNET_PROCESSOR_COUNT=1
      - DOTNET_ThreadPool_UnfairSemaphoreSpinLimit=0
      - GC_LATENCY_MODE=sustained

      # Paths
      - INDEX_PATH=/app/data/knn.idx
      - IVF_INDEX_PATH=/app/data/ivf.idx
      - RESOURCES_PATH=/app/resources

      # Search
      - USE_BRUTE=false
      - USE_IVF=true

      # MELHOR CONFIG ENCONTRADA
      - IVF_CLUSTERS=128
      - IVF_NPROBE=1
      - IVF_MAX_VECTORS=64
      - IVF_ITERS=7

      # KNN
      - KNN_K=5
      - FRAUD_THRESHOLD=0.60

      # Partitioning
      - MAX_PARTITIONS_TO_SCAN=1
      - MAX_PARTITION_ITEMS=64
      - MAX_PARTITION_HARD=true
      - PARTITION_ONLY=true

      # ThreadPool
      - TP_MIN_WORKERS=4
      - TP_MAX_WORKERS=4
      - TP_MIN_IO=2
      - TP_MAX_IO=4

      # ASP.NET
      - KESTREL_BACKLOG=4096
      - ASPNETCORE_LOGGING__LOGLEVEL__DEFAULT=Warning

    volumes:
      - uds:/run/uds
    cpus: "0.42"
    mem_limit: 160m

volumes:
  uds:
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  app:
    driver: bridge