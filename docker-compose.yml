services:
  lb:
    image: nginx:1.27-alpine
    container_name: lb
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - uds:/run/uds
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    cpus: "0.16"
    mem_limit: 30m
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  api1:
    image: engelguidev/rinha-fraud-api:latest
    container_name: api1
    environment:
      - UDS_PATH=/run/uds/api1.sock

      - DOTNET_GCHeapCount=1
      - DOTNET_PROCESSOR_COUNT=1
      - DOTNET_ThreadPool_UnfairSemaphoreSpinLimit=0

      - INDEX_PATH=/app/data/knn.idx
      - RESOURCES_PATH=/app/resources

      - USE_BRUTE=false
      - USE_IVF=true

      - IVF_INDEX_PATH=/app/data/ivf.idx
      - IVF_CLUSTERS=256
      - IVF_NPROBE=1
      - IVF_MAX_VECTORS=128

      - ASPNETCORE_LOGGING__LOGLEVEL__DEFAULT=Error

      - KNN_K=1
      - FRAUD_THRESHOLD=0.60

      - MAX_PARTITIONS_TO_SCAN=1
      - MAX_PARTITION_ITEMS=64
      - MAX_PARTITION_HARD=true
      - PARTITION_ONLY=true

    volumes:
      - uds:/run/uds

    cpus: "0.42"
    mem_limit: 160m

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  api2:
    image: engelguidev/rinha-fraud-api:latest
    container_name: api2
    environment:
      - UDS_PATH=/run/uds/api2.sock

      - DOTNET_GCHeapCount=1
      - DOTNET_PROCESSOR_COUNT=1
      - DOTNET_ThreadPool_UnfairSemaphoreSpinLimit=0

      - INDEX_PATH=/app/data/knn.idx
      - RESOURCES_PATH=/app/resources

      - USE_BRUTE=false
      - USE_IVF=true

      - IVF_INDEX_PATH=/app/data/ivf.idx
      - IVF_CLUSTERS=256
      - IVF_NPROBE=1
      - IVF_MAX_VECTORS=128

      - ASPNETCORE_LOGGING__LOGLEVEL__DEFAULT=Error

      - KNN_K=1
      - FRAUD_THRESHOLD=0.60

      - MAX_PARTITIONS_TO_SCAN=1
      - MAX_PARTITION_ITEMS=64
      - MAX_PARTITION_HARD=true
      - PARTITION_ONLY=true

    volumes:
      - uds:/run/uds

    cpus: "0.42"
    mem_limit: 160m

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

volumes:
  uds:
    driver_opts:
      type: tmpfs
      device: tmpfs

networks:
  default:
    driver: bridge
