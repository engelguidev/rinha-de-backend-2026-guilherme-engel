services:
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api1
      - api2
    deploy:
      resources:
        limits:
          cpus: "0.10"
          memory: "20MB"

  api1:
    image: engelguidev/rinha-fraud-api@sha256:d703e11f7acf4c0aa8ebcbf4d9df12220575e64bef20e90c3940aecfb9a9a737
    environment:
      - RESOURCES_PATH=/app/resources
      - INDEX_PATH=/app/data/knn.idx
    volumes:
      - ./resources:/app/resources:ro
      - ./data:/app/data:ro
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

  api2:
    image: engelguidev/rinha-fraud-api@sha256:d703e11f7acf4c0aa8ebcbf4d9df12220575e64bef20e90c3940aecfb9a9a737
    environment:
      - RESOURCES_PATH=/app/resources
      - INDEX_PATH=/app/data/knn.idx
    volumes:
      - ./resources:/app/resources:ro
      - ./data:/app/data:ro
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: "165MB"

